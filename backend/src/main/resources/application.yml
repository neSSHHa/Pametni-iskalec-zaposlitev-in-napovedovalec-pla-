server:
  port: 8080

spring:
  application:
    name: smartjobs-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartjobs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:nenadnenad}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

smartjobs:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    openrouter-url: ${OPENROUTER_URL:https://openrouter.ai/api/v1}
    openrouter-api-key: ${OPENROUTER_API_KEY:}
    openrouter-referer: ${OPENROUTER_REFERER:http://localhost:3000}
    openrouter-title: ${OPENROUTER_TITLE:Smart Jobs Platform}
    model: ${OPENROUTER_MODEL:poolside/laguna-xs.2:free}
