server:
  port: 8080

spring:
  application:
    name: smartjobs-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartjobs?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:nenadnenad}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  security:
    oauth2:
        resourceserver:
          jwt:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/smartjobs}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/smartjobs/protocol/openid-connect/certs}

smartjobs:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8090}
  salary:
    service-url: ${SALARY_SERVICE_URL:http://localhost:8091}
