services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev

  data-importer:
    profiles:
      - import
    build: ../data-ingestion
    volumes:
      - ../data-ingestion/data:/app/data
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartjobs}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nenadnenad}
      ZRSZ_JSON_URL: ${ZRSZ_JSON_URL:-}
      BACKEND_CACHE_REFRESH_URL: ${BACKEND_CACHE_REFRESH_URL:-http://backend:8080/api/admin/cache/refresh}
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

  salary-trainer:
    profiles:
      - import
    build: ../salary-service
    command: ["python", "train_model.py"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartjobs}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nenadnenad}
    volumes:
      - salary_models:/app/models
    depends_on:
      data-importer:
        condition: service_completed_successfully

  weekly-job-updater:
    profiles:
      - jobs
    build: ../weekly-job-updater
    volumes:
      - ../weekly-job-updater/data:/app/data
      - ../data-ingestion/data:/data-ingestion/data:ro
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartjobs}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nenadnenad}
      BACKEND_CACHE_REFRESH_URL: ${BACKEND_CACHE_REFRESH_URL:-http://backend:8080/api/admin/cache/refresh}
      WEEKLY_UPDATE_MODE: ${WEEKLY_UPDATE_MODE:---full-sync-preview}
      JOB_UPDATE_OUTPUT_DIR: ${JOB_UPDATE_OUTPUT_DIR:-data/three-day-sync}
      ZRSZ_JSON_URL: ${ZRSZ_JSON_URL:-}
      ZRSZ_LOCAL_FILE: ${ZRSZ_LOCAL_FILE:-/data-ingestion/data/zrsz_weekly_test.json}
      CAREERJET_API_KEY: ${CAREERJET_API_KEY:-}
      CAREERJET_USER_IP: ${CAREERJET_USER_IP:-164.8.39.10}
      OPENROUTER_API_KEYS: ${OPENROUTER_API_KEYS:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      NORMALIZATION_BATCH_SIZE: ${NORMALIZATION_BATCH_SIZE:-15}
      NORMALIZATION_MAX_ATTEMPTS_PER_BATCH: ${NORMALIZATION_MAX_ATTEMPTS_PER_BATCH:-3}
      NORMALIZATION_MAX_BATCHES_PER_RUN: ${NORMALIZATION_MAX_BATCHES_PER_RUN:-0}
      NORMALIZATION_RETRY_FAILED_FINAL_AFTER_HOURS: ${NORMALIZATION_RETRY_FAILED_FINAL_AFTER_HOURS:-24}
      NORMALIZATION_MIN_SUCCESS_RATIO_SLOVENIA: ${NORMALIZATION_MIN_SUCCESS_RATIO_SLOVENIA:-0.85}
      NORMALIZATION_MIN_SUCCESS_RATIO_AUSTRIA: ${NORMALIZATION_MIN_SUCCESS_RATIO_AUSTRIA:-0.85}
      SYNC_CYCLE_MAX_AGE_DAYS: ${SYNC_CYCLE_MAX_AGE_DAYS:-7}
      EURES_AUSTRIA_LOCATION_CODES: ${EURES_AUSTRIA_LOCATION_CODES:-at13,at32,at21,at34,at11}
    depends_on:
      mysql:
        condition: service_healthy

  weekly-job-updater-scheduler:
    profiles:
      - scheduler
    build: ../weekly-job-updater
    command: ["-Dexec.args=--scheduler"]
    restart: unless-stopped
    volumes:
      - ../weekly-job-updater/data:/app/data
      - ../data-ingestion/data:/data-ingestion/data:ro
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartjobs}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nenadnenad}
      BACKEND_CACHE_REFRESH_URL: ${BACKEND_CACHE_REFRESH_URL:-http://backend:8080/api/admin/cache/refresh}
      JOB_UPDATER_SCHEDULER_INTERVAL_HOURS: ${JOB_UPDATER_SCHEDULER_INTERVAL_HOURS:-72}
      JOB_UPDATER_SCHEDULER_RUN_ON_START: ${JOB_UPDATER_SCHEDULER_RUN_ON_START:-true}
      WEEKLY_UPDATE_MODE: --full-sync-apply
      JOB_UPDATE_OUTPUT_DIR: ${JOB_UPDATE_OUTPUT_DIR:-data/three-day-sync}
      ZRSZ_JSON_URL: ${ZRSZ_JSON_URL:-}
      ZRSZ_LOCAL_FILE: ${ZRSZ_LOCAL_FILE:-/data-ingestion/data/zrsz_weekly_test.json}
      CAREERJET_API_KEY: ${CAREERJET_API_KEY:-}
      CAREERJET_USER_IP: ${CAREERJET_USER_IP:-164.8.39.10}
      OPENROUTER_API_KEYS: ${OPENROUTER_API_KEYS:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      NORMALIZATION_BATCH_SIZE: ${NORMALIZATION_BATCH_SIZE:-15}
      NORMALIZATION_MAX_ATTEMPTS_PER_BATCH: ${NORMALIZATION_MAX_ATTEMPTS_PER_BATCH:-3}
      NORMALIZATION_MAX_BATCHES_PER_RUN: ${NORMALIZATION_MAX_BATCHES_PER_RUN:-0}
      NORMALIZATION_RETRY_FAILED_FINAL_AFTER_HOURS: ${NORMALIZATION_RETRY_FAILED_FINAL_AFTER_HOURS:-24}
      NORMALIZATION_MIN_SUCCESS_RATIO_SLOVENIA: ${NORMALIZATION_MIN_SUCCESS_RATIO_SLOVENIA:-0.85}
      NORMALIZATION_MIN_SUCCESS_RATIO_AUSTRIA: ${NORMALIZATION_MIN_SUCCESS_RATIO_AUSTRIA:-0.85}
      SYNC_CYCLE_MAX_AGE_DAYS: ${SYNC_CYCLE_MAX_AGE_DAYS:-7}
      EURES_AUSTRIA_LOCATION_CODES: ${EURES_AUSTRIA_LOCATION_CODES:-at13,at32,at21,at34,at11}
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
