name: smart-job-platform

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartjobs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command:
      - start-dev
      - --import-realm
      - --hostname=${VITE_KEYCLOAK_URL}
      - --hostname-strict=false
      - --http-relative-path=/keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak-theme/jobradar:/opt/keycloak/themes/jobradar:ro
    restart: always

  backend:
    build: ../backend
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smartjobs}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AI_SERVICE_URL: http://ai-service:8090
      SALARY_SERVICE_URL: http://salary-service:8091
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/smartjobs/protocol/openid-connect/certs}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak:
        condition: service_started
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
      salary-service:
        condition: service_started
    restart: always

  ai-service:
    build: ../ai-service
    env_file:
      - ../.env
    environment:
      AI_SERVICE_PORT: 8090
    restart: always

  salary-service:
    build: ../salary-service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartjobs}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - salary_models:/app/models
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-smartjobs}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-jobradar-frontend}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
  salary_models:
