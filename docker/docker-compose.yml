name: smart-job-platform

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartjobs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nenadnenad}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8081", "--hostname-strict=false"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak-theme/jobradar:/opt/keycloak/themes/jobradar:ro

  backend:
    build: ../backend
    env_file:
      - ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smartjobs}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nenadnenad}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AI_SERVICE_URL: http://ai-service:8090
      SALARY_SERVICE_URL: http://salary-service:8091
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/smartjobs}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/smartjobs/protocol/openid-connect/certs}
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_started
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
      salary-service:
        condition: service_started

  ai-service:
    build: ../ai-service
    env_file:
      - ../.env
    environment:
      AI_SERVICE_PORT: 8090
    ports:
      - "8090:8090"

  salary-service:
    build: ../salary-service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartjobs}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nenadnenad}
    ports:
      - "8091:8091"
    volumes:
      - salary_models:/app/models
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-smartjobs}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-jobradar-frontend}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  salary_models:
